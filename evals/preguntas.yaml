# ---------------------------------------------------------------- Manual del estudiante
- id: man-01
  conjunto: dev
  pregunta: ¿Quién puede autorizar el sobrepaso de un prerrequisito?
  tiene_respuesta: true
  evidencia: Solo el decano o coordinador correspondiente pueden autorizarlo
- id: man-02
  conjunto: dev
  pregunta: ¿Qué representa un crédito en la USFQ?
  tiene_respuesta: true
  evidencia: Un crédito representa una hora de contacto con el profesor
- id: man-03
  conjunto: test
  pregunta: ¿Cuál es el promedio acumulado mínimo que exige la universidad?
  tiene_respuesta: true
  evidencia: promedio acumulado GPA de al menos 2,00/4,00
- id: man-04
  conjunto: dev
  pregunta: ¿Qué pasa si mi promedio acumulado es igual o menor a 1,00?
  tiene_respuesta: true
  evidencia: el estudiante será separado de la institución
- id: man-05
  conjunto: dev
  pregunta: ¿Cuántas matrículas se admiten en una misma materia?
  tiene_respuesta: true
  evidencia: No se admiten más de tres matrículas en una misma materia
- id: man-06
  conjunto: test
  pregunta: ¿A quién le pido autorización para una tercera matrícula?
  tiene_respuesta: true
  evidencia: debe solicitar la autorización al Decano de Grado y Asuntos Académicos
- id: man-07
  conjunto: dev
  pregunta: ¿Cuántas veces puedo retirarme de la misma materia?
  tiene_respuesta: true
  evidencia: Solo es posible retirarse hasta por dos ocasiones de una misma materia
- id: man-08
  conjunto: dev
  pregunta: ¿Alguna autoridad puede autorizarme más créditos que la carga máxima?
  tiene_respuesta: true
  evidencia: Ninguna autoridad podrá autorizar un mayor número de créditos
- id: man-09
  conjunto: test
  pregunta: ¿Quién define las políticas de ausencias y puntualidad de un curso?
  tiene_respuesta: true
  evidencia: Cada profesor establece en su syllabus las políticas referentes a ausencias
- id: man-10
  conjunto: dev
  pregunta: ¿Qué hago si un curso no tiene syllabus?
  tiene_respuesta: true
  evidencia: El estudiante debe reportar en su decanato si algún curso no tiene syllabus
- id: man-11
  conjunto: dev
  pregunta: ¿Qué promedio semestral necesito para la Lista de Honor del Canciller?
  tiene_respuesta: true
  evidencia: promedio semestral mayor o igual a 3,70/4,00
- id: man-12
  conjunto: test
  pregunta: ¿Con qué nota mínima se aprueban los cursos de especialización?
  tiene_respuesta: true
  evidencia: Los cursos de especialización se aprueban con una nota mínima de
- id: man-13
  conjunto: dev
  pregunta: ¿Cuántos créditos tiene una subespecialización o minor?
  tiene_respuesta: true
  evidencia: una subespecialización que se compone de 15 a 18 créditos
- id: man-14
  conjunto: dev
  pregunta: ¿Cómo retiro una materia cuando ya pasó el plazo para salirme o cambiarme?
  tiene_respuesta: true
  evidencia: el retiro de un curso o varios respetando la carga mínima
- id: man-15
  conjunto: test
  pregunta: ¿A dónde acudo si no logro resolver una controversia con un profesor?
  tiene_respuesta: true
  evidencia: De no encontrar solución se debe acudir a la Oficina del Ombudsman
- id: man-16
  conjunto: dev
  pregunta: ¿Se pueden eliminar del kárdex las materias reprobadas?
  tiene_respuesta: true
  evidencia: No es posible eliminar materias de un kárdex académico aprobadas o reprobadas

