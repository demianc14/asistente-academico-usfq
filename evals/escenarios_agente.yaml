            cursos: [{codigo: EJM1002, nrc: "1002"}, {codigo: EJM2001, nrc: "1004"}]
    - accion: proponer
      plan:
        aprobados: [EJM1001, EJC1001, EJG1001, EJC1002, EJC1003, EJC2001, EJM2001]
        semestres:
          - periodo: "209910"
            cursos: [{codigo: EJC2002, nrc: "1005"}]
    - accion: herramienta
      nombre: verificar_plan
      argumentos:
        creditos_max: 99
        aprobados: [EJM1001, EJC1001, EJG1001, EJC1002, EJC1003, EJC2001, EJM2001]
        semestres:
          - periodo: "209910"
            cursos: [{codigo: EJM1002, nrc: "1002"}, {codigo: EJC2002, nrc: "1005"}]
  esperado:
