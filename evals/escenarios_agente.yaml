# Escenarios de evaluación del agente planificador (Fase 3). Datos de ejemplo (códigos EJ…).
#
# CONGELADOS el 14-nov-2026. Los redactó el agente; Demian revisó la tabla de los 15 primeros
# y pidió ag-16 y ag-17. Los resultados esperados se dedujeron a mano de
# `datos/ejemplo/malla.yaml`, sin ejecutar el bucle: hasta este commit ningún test cargó el
# archivo y no se corrió ni una vez. Cualquier cambio posterior va en un commit aparte y se
# anota en `docs/evaluacion.md`.
#
# V2, CONGELADA el 15-nov-2026 tras la revisión adversarial (F-01 a F-08). Cambios: toda
# solicitud trae `periodo` (lo llena la interfaz, como `creditos_max`); ag-06 y ag-11 traen
# `cursos_pedidos`; ag-10 intenta colar también `aprobados` que harían pasar el plan; ag-16
# pasa a ser "falta el periodo", que pregunta el código sin llamar al LLM. Igual que la v1, lo
# esperado se dedujo a mano y este archivo se confirmó antes de ejecutar el bucle sobre él.
#
# Cada escenario trae el guion que seguirá el cliente falso (una respuesta por llamada: una
# acción, o un texto suelto cuando se quiere una salida que no es JSON) y lo que debe salir. Con guion, estas cifras miden el bucle y el guion, no a Gemini.
#
# `esperado`:
#   estado              plan | pregunta | abstencion
#   pregunta / motivo   valor del catálogo, según el estado
#   vueltas             correcciones usadas (propuestas hechas menos una)
#   llamadas            llamadas al LLM; si el guion trae más respuestas, las de sobra no se piden
#   horario_verificado  solo con estado plan
#   plan                solo con estado plan: periodo → cursos, "CÓDIGO/NRC" o "CÓDIGO" sin NRC
#   pasos               qué debe hacer el código en cada llamada: el nombre de la herramienta
#                       ("verificar_plan" para una propuesta) o pregunta / abstencion /
#                       salida_invalida
#   inventados          códigos inexistentes que el código debe atrapar, únicos por escenario
#   intentos_inventados cuántas veces los atrapó (el mismo código puede intentarse varias veces)
#   preferencias_no_verificadas   solo con estado plan: las de la solicitud, que el plan
#                       visible lista como no verificadas. Cumplirlas o no no cuenta como acierto.
#   pedidos_fuera       solo con estado plan: código de `cursos_pedidos` que no entró → tipos
#                       de motivo (sin repetir, en orden) que da `verificar_plan` al añadirlo
#                       al plan mostrado; ["no_propuesto"] si habría cabido.

# ---------------------------------------------------------------- válido a la primera
- id: ag-01
  categoria: valido_a_la_primera
  descripcion: Consulta habilitados y horarios, y propone dos cursos con secciones que no chocan.
  solicitud:
    texto: Quiero un plan para 209910 con las materias de matemáticas que ya puedo tomar.
    periodo: "209910"
    creditos_max: 18
    aprobados: &aprobados [EJM1001, EJC1001, EJG1001, EJC1002, EJC1003]
    preferencias: [materias de matemáticas]
  guion:
    - {accion: herramienta, nombre: cursos_habilitados, argumentos: {aprobados: *aprobados}}
    - {accion: herramienta, nombre: horarios, argumentos: {curso: EJM1002, periodo: "209910"}}
    - {accion: herramienta, nombre: horarios, argumentos: {curso: EJM2001, periodo: "209910"}}
    - accion: proponer
      plan:
        semestres:
          - periodo: "209910"
            cursos: [{codigo: EJM1002, nrc: "1002"}, {codigo: EJM2001, nrc: "1004"}]
  esperado:
    estado: plan
    vueltas: 0
    llamadas: 4
    horario_verificado: true
    plan: {"209910": [EJM1002/1002, EJM2001/1004]}
    preferencias_no_verificadas: [materias de matemáticas]
    pasos: [cursos_habilitados, horarios, horarios, verificar_plan]
    inventados: []
    intentos_inventados: 0

- id: ag-02
  categoria: valido_a_la_primera
  descripcion: >-
    Propone directo, sin consultar. Lo que se mide es que el plan pase y que "sin clases los
    viernes" salga como preferencia no verificada. Que las secciones elegidas no tengan clase
    el viernes es cosa del guion y no cuenta como acierto.
  solicitud:
    texto: Cálculo II y Matemática discreta en 209910, sin clases los viernes.
    periodo: "209910"
    creditos_max: 18
    aprobados: *aprobados
    preferencias: [sin clases los viernes]
  guion:
    - accion: proponer
      plan:
        semestres:
          - periodo: "209910"
            cursos: [{codigo: EJM1002, nrc: "1001"}, {codigo: EJM2001, nrc: "1004"}]
  esperado:
    estado: plan
    vueltas: 0
    llamadas: 1
    horario_verificado: true
    plan: {"209910": [EJM1002/1001, EJM2001/1004]}
    preferencias_no_verificadas: [sin clases los viernes]
    pasos: [verificar_plan]
    inventados: []
    intentos_inventados: 0

