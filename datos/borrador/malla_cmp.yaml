# BORRADOR. Malla de Ingeniería en Ciencias de la Computación (USFQ).
#
# Fuente: "Malla de bloques", versión del 06-may-2026 (ver docs/fuentes.md).
# Transcrito el 11-nov-2026 a partir de las coordenadas del texto del PDF:
# código, nombre y créditos de cada caja, y el semestre según su fila.
#
# LOS PRERREQUISITOS NO ESTÁN TRANSCRITOS. En el PDF son flechas que se cruzan
# y no hay texto que las respalde. Mientras `pre` y `co` estén vacíos este
# archivo NO sirve para planificar: por eso vive en datos/borrador/ y el ETL no
# lo carga por defecto. Cuando Demian confirme los prerrequisitos contra el
# catálogo del portal, se mueve a datos/malla.yaml.
#
# `area` usa la leyenda del diagrama: carrera (cajas blancas), colegio_general
# (gris claro) e idiomas (gris oscuro, 0 créditos).
#
# Reglas del diagrama que no son prerrequisitos entre cursos y aún no se modelan:
#   - CMP 5992 solo se toma en el último semestre.
#   - PAS 4000 debería tomarse en el último verano antes de graduarse.
#   - Hay que registrarse en al menos una clase impartida en inglés.
#   - Hay que aprobar una materia con atributo Writing Intensive (prerrequisito: Inglés Nivel 6).
#   - Las tres optativas son cursos de nivel 2000 o 3000 de cualquier área; una debe tener
#     componente de gestión de proyectos (IIN 4011, ADM 4006, REL 4005, DIT 4001 o ICV 4080).
#   - 3 créditos equivalen a 144 horas.
carrera: CMP

